plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

base {
    archivesName = "forge-${mod_id}-${minecraft_version}"
}

repositories {
    maven { url = "https://cursemaven.com" }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        "0.4.1"
    }

    //RUNICLIB
    modImplementation "curse.maven:runiclib-880879:${forge_runiclib}" //<--- UNCOMMENT WHEN USING RELEASE RUNIC
    //implementation files("forge-runiclib-1.20.1-4.3.8.jar")

    //TESTING
    modImplementation "curse.maven:jei-238222:7920915"
    modImplementation "curse.maven:nirvana-1278909:7743577"
    modImplementation "curse.maven:kotlin-for-forge-351264:7291067"
}

jar {
    finalizedBy('reobfJar')
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}

sourceSets.main.resources { srcDir project(":common").file('src/main/generated/').getAbsolutePath() }